name: CodeQL

# Hours of analysis (about three, five with the tests on 2026-11-25, of the six a job may take): on pull requests,
# every week (the branch as it is then, with the newest queries) and when asked for, not on every push.
on:
  pull_request:
    branches: ["main"]
    paths: ["**", "!**.md", "!docs/**"]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the pull request makes the run still going useless: it is cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    # Code scanning needs a paid plan on a private repository: from the day the repository is public.
    if: ${{ !github.event.repository.private }}
    name: C/C++ analysis
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        uses: ./.github/actions/linux-deps
        with:
          compiler: g++-12

      - name: Configure
        # Without ccache: CodeQL must see every compilation.
        env:
          CC: gcc-12
          CXX: g++-12
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DFCG_CCACHE=OFF -DFCG_ASSISTANT=OFF -DFCG_BUILD_TESTS=OFF

      - name: Build the dependencies
        # Before CodeQL watches the compiler: the FetchContent libraries are not analysed (their known
        # vulnerabilities are the SBOM scan's job), and SDL3 and Mbed TLS alone would double the analysis time. Not
        # libssh2, which compiles our cryptography backend with it (gui/libssh2-psa/).
        run: cmake --build build --target SDL3-static imgui_lib mbedtls tinygettext fcg_zstd fcg_zlib fcg_lzma fcg_md4c

      - uses: github/codeql-action/init@v4
        with:
          languages: c-cpp
          build-mode: manual
          queries: security-extended

      - name: Build
        # The GUI, the tournament, study and commentary layers and the vendored fastchess (its core library and
        # command line tool), all compiled under CodeQL; not the tests (FCG_BUILD_TESTS off), whose results were left
        # out and which took a third of the time. Two at a time: under CodeQL's extractor the largest views take a
        # few GB each, and six at once (Ninja's default on the runner's four processors) ran it out of memory.
        run: cmake --build build -j 2

      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:c-cpp
          upload: never
          output: sarif-results

      - name: Drop the dependencies' and the tests' results
        # What CodeQL still saw of them (libssh2, compiled with our backend, and the header-only libraries compiled
        # in our files) lives under build/_deps, as do the generated sources under build/generated: everything
        # under build/ is left out. paths-ignore does not apply to a compiled language's manual build. The tests
        # and the fuzz targets are not compiled here, and would be left out (not shipped); the vendored fastchess
        # (app/) is not.
        run: |
          sarif=$(ls sarif-results/*.sarif)
          jq '.runs[].results |= map(select((.locations[0].physicalLocation.artifactLocation.uri // "")
                                            | test("^(file://)?(\(env.GITHUB_WORKSPACE)/)?(build|tests|gui/tests|tournament/tests|study/tests|commentary/tests|fuzz)/")
                                            | not))' \
            "$sarif" > filtered.sarif
          echo "Results: $(jq '[.runs[].results[]] | length' "$sarif") found," \
               "$(jq '[.runs[].results[]] | length' filtered.sarif) kept"

      - uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: filtered.sarif
          category: /language:c-cpp
