name: fastchess-gui

on:
  push:
    branches: ["main"]
    tags: ["v*"]
    # Not for a change of the documentation alone (the guide excepted: it is built into the program, and a test reads
    # it). Tags are not filtered:
    # a release is always built.
    paths: ["**", "!**.md", "!docs/**", "docs/guide*.md", "docs/screenshots/appearance.png"]
  pull_request:
    branches: ["main"]
    paths: ["**", "!**.md", "!docs/**", "docs/guide*.md", "docs/screenshots/appearance.png"]
  # A private repository pays its minutes: a push runs the Linux build and tests alone; the sanitizers and Windows run
  # on a tag and on a run by hand.
  workflow_dispatch:
    inputs:
      macos:
        description: "The Mac too (a private repository counts its minutes ten times)"
        type: boolean
        default: false

permissions:
  contents: read

env:
  # Translations and the guide's are made in a batch before each preview (PLAN.md): the tests report the missing
  # ones without failing, except for a tag, which must have them all.
  FCG_STRICT_TRANSLATIONS: ${{ startsWith(github.ref, 'refs/tags/v') && '1' || '0' }}

# A newer push to the branch or to the pull request makes the run still going useless: it is cancelled. Never a
# release's.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  linux:
    name: Linux build and tests
    # Ubuntu 26.04 and gcc 15, though the program runs on glibc 2.38 or newer (Ubuntu 24.04, Debian 13, Fedora 39,
    # RHEL 10 and later): cmake/glibc_floor.h, which a step checks. fastchess-gui's own job stays on 22.04: keep this
    # one when merging it.
    runs-on: ubuntu-26.04
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 500M
    steps:
      - uses: actions/checkout@v7

      - name: Use the main Ubuntu archive
        # The runners' Azure mirror can stay unresolvable for hours; the main archive does not depend on it.
        run: |
          sudo sed -i -e 's#mirror+file:/etc/apt/apt-mirrors.txt#http://archive.ubuntu.com/ubuntu/#' \
            -e 's#http://azure.archive.ubuntu.com/ubuntu/*#http://archive.ubuntu.com/ubuntu/#' \
            /etc/apt/sources.list /etc/apt/sources.list.d/*.sources 2>/dev/null || true
          echo 'Acquire::Retries "5";' | sudo tee /etc/apt/apt.conf.d/80-retries
          # The runner's resolver can fail on Ubuntu's hosts alone: public resolvers then.
          if ! getent hosts archive.ubuntu.com > /dev/null; then
            sudo mkdir -p /etc/systemd/resolved.conf.d
            printf '[Resolve]\nDNS=1.1.1.1 8.8.8.8\n' | sudo tee /etc/systemd/resolved.conf.d/fallback.conf
            sudo systemctl restart systemd-resolved
            getent hosts archive.ubuntu.com || true
          fi

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build ccache g++-15 \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev libxtst-dev \
            libxkbcommon-dev libwayland-dev wayland-protocols libdecor-0-dev libegl1-mesa-dev libgl1-mesa-dev \
            libdrm-dev libgbm-dev libdbus-1-dev libudev-dev libpipewire-0.3-dev libpulse-dev libasound2-dev

      - name: Vulkan
        # The assistant's GPU backend, for a release and on demand: its shaders take minutes that no cache keeps.
        # Ubuntu 26.04's glslc (shaderc 2026.1) knows the extensions of ggml's faster shaders, all but two of the
        # newest: NVIDIA's vector decoding for cooperative matrices and FP4 (commentary-v11 on an RTX 5080: prompts
        # 4 to 7 % slower than with LunarG's SDK, a comment 0.5 %). With the headers, ggml's SPIRV-Headers and the
        # loader to link with.
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        run: sudo apt-get install -y --no-install-recommends glslc libvulkan-dev spirv-headers

      - name: Compiler cache
        # What the last runs compiled (the dependencies above all): only what changed is compiled again.
        uses: actions/cache/restore@v6
        with:
          path: .ccache
          key: ccache-linux-resolute-${{ github.run_id }}
          restore-keys: ccache-linux-resolute-

      - name: Configure
        env:
          CC: gcc-15
          CXX: g++-15
          VULKAN: ${{ (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') && 'ON' || 'OFF' }}
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DFCG_STATIC_RUNTIME=ON -DFCG_ASSISTANT_VULKAN=${VULKAN}

      - name: Build
        run: |
          ccache -z
          cmake --build build
          ccache -s

      - name: Compiler cache saved
        # Even when a later step fails or the run is cancelled: a cold build costs a private repository's
        # minutes again.
        if: always()
        uses: actions/cache/save@v6
        with:
          path: .ccache
          key: ccache-linux-resolute-${{ github.run_id }}

      - name: The glibc the program asks for
        # README.md's 2.38: a function a newer glibc gave a new version, left out of cmake/glibc_floor.h, or one new
        # since, would ask for more.
        run: |
          files="build/rookstudio build/fastchess $(find build -maxdepth 1 -name '*.so' | sort)"
          echo "Newest version asked for: $(objdump -T $files | grep -oE 'GLIBC_2\.[0-9]+' | sort -uV | tail -1)"
          newer=$(objdump -T $files | grep -E 'GLIBC_2\.(39|[4-9][0-9])\b' || true)
          if [ -n "$newer" ]; then echo "Newer than glibc 2.38:"; echo "$newer"; exit 1; fi

      - name: Tests
        # Side by side, each test case in a process of its own (tools/run_tests.py): they mostly wait, so two per
        # processor, counted on the runner (a public repository's has four, a private one's two: twice as many tests at
        # once there make their waits too short). fastchess' own tests run when app/ changes (upstream_tests.yml).
        run: |
          python3 tools/run_tests.py -j $(( $(nproc) * 2 )) build/fastchess-gui-tests build/fcg-tournament-tests \
            build/fcg-study-tests build/fcg-commentary-tests

      - name: The window drawn without OpenGL
        # SDL's software renderer, what a machine without OpenGL 3.2 gets: the program starts, draws its Settings page
        # off screen (the offscreen driver --shot picks) and saves it.
        run: |
          ./build/rookstudio --software --profile "${RUNNER_TEMP}/software" --size 1280x800 \
            --shot "${RUNNER_TEMP}/software.png@settings@3"
          cat "${RUNNER_TEMP}/software/rookstudio.log"
          grep -q "software driver" "${RUNNER_TEMP}/software/rookstudio.log"
          test -s "${RUNNER_TEMP}/software.png"
          ls -l "${RUNNER_TEMP}/software.png"

      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: |
            build/rookstudio
            build/fastchess
            build/*.so

  sanitizers:
    name: Linux tests with AddressSanitizer and UBSan
    # Not at each push: on a tag, a pull request or a run by hand.
    if: github.event_name != 'push' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-26.04
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 500M
    steps:
      - uses: actions/checkout@v7

      - name: Use the main Ubuntu archive
        # The runners' Azure mirror can stay unresolvable for hours; the main archive does not depend on it.
        run: |
          sudo sed -i -e 's#mirror+file:/etc/apt/apt-mirrors.txt#http://archive.ubuntu.com/ubuntu/#' \
            -e 's#http://azure.archive.ubuntu.com/ubuntu/*#http://archive.ubuntu.com/ubuntu/#' \
            /etc/apt/sources.list /etc/apt/sources.list.d/*.sources 2>/dev/null || true
          echo 'Acquire::Retries "5";' | sudo tee /etc/apt/apt.conf.d/80-retries
          # The runner's resolver can fail on Ubuntu's hosts alone: public resolvers then.
          if ! getent hosts archive.ubuntu.com > /dev/null; then
            sudo mkdir -p /etc/systemd/resolved.conf.d
            printf '[Resolve]\nDNS=1.1.1.1 8.8.8.8\n' | sudo tee /etc/systemd/resolved.conf.d/fallback.conf
            sudo systemctl restart systemd-resolved
            getent hosts archive.ubuntu.com || true
          fi

      - name: Install dependencies
        # clang 23 from LLVM's archive, as for the fuzzers: everything instrumented compiles in a third of gcc's time.
        run: |
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc > /dev/null
          echo "deb https://apt.llvm.org/resolute/ llvm-toolchain-resolute-23 main" | sudo tee /etc/apt/sources.list.d/llvm-23.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build ccache clang-23 libclang-rt-23-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev libxtst-dev \
            libxkbcommon-dev libwayland-dev wayland-protocols libdecor-0-dev libegl1-mesa-dev libgl1-mesa-dev \
            libdrm-dev libgbm-dev libdbus-1-dev libudev-dev libpipewire-0.3-dev libpulse-dev libasound2-dev

      - name: Address space randomisation AddressSanitizer works with
        # The runner's kernel randomises more address bits than the sanitizers' shadow memory allows.
        run: sudo sysctl -w vm.mmap_rnd_bits=28

      - name: Compiler cache
        # What the last runs compiled (the dependencies above all): only what changed is compiled again.
        uses: actions/cache/restore@v6
        with:
          path: .ccache
          key: ccache-sanitizers-resolute-${{ github.run_id }}
          restore-keys: ccache-sanitizers-resolute-

      - name: Configure
        # Everything instrumented, the dependencies too; the test engines the tests start as well. Without the
        # assistant's language model runtime: llama.cpp instrumented would double the build, and is not ours to fix.
        env:
          CC: clang-23
          CXX: clang++-23
        run: >
          cmake -B build-asan -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo
          "-DCMAKE_C_FLAGS=-fsanitize=address,undefined -fno-omit-frame-pointer"
          "-DCMAKE_CXX_FLAGS=-fsanitize=address,undefined -fno-omit-frame-pointer"
          "-DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address,undefined"
          -DFCG_ASSISTANT=OFF

      - name: Build
        run: |
          ccache -z
          cmake --build build-asan --target fastchess-gui-tests fcg-tournament-tests fcg-study-tests \
            fcg-commentary-tests
          ccache -s

      - name: Compiler cache saved
        # Even when a later step fails or the run is cancelled: a cold build costs a private repository's
        # minutes again.
        if: always()
        uses: actions/cache/save@v6
        with:
          path: .ccache
          key: ccache-sanitizers-resolute-${{ github.run_id }}

      - name: Tests
        # Side by side, each test case in a process of its own (tools/run_tests.py), one per processor: instrumented,
        # they are slower and some of their waits are short. Every report to a file of its process's own: the test
        # cases' and those of the engines they start, whose output the tests read. A report fails its test case; any
        # report fails the next step. Each call's locals on the stack, not in AddressSanitizer's heap for use after
        # return: libssh2 sends the rest of a keepalive only from a buffer at the same address as the first time, a
        # local of its keepalive function.
        env:
          ASAN_OPTIONS: detect_leaks=1:detect_stack_use_after_return=0:log_path=${{ runner.temp }}/sanitizers/report
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1:log_path=${{ runner.temp }}/sanitizers/report
        run: |
          mkdir -p "${RUNNER_TEMP}/sanitizers"
          python3 tools/run_tests.py -j $(nproc) build-asan/fastchess-gui-tests build-asan/fcg-tournament-tests \
            build-asan/fcg-study-tests build-asan/fcg-commentary-tests

      - name: Sanitizer reports
        if: always()
        run: |
          shopt -s nullglob
          reports=("${RUNNER_TEMP}"/sanitizers/*)
          for report in "${reports[@]}"; do echo "== ${report}"; cat "${report}"; done
          [ ${#reports[@]} -eq 0 ]

  windows-build:
    name: Windows cross-build
    # As the sanitizers: code that differs on Windows is rare, and a Windows runner's minutes count twice.
    if: github.event_name != 'push' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-26.04
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 500M
    steps:
      - uses: actions/checkout@v7

      - name: Use the main Ubuntu archive
        # The runners' Azure mirror can stay unresolvable for hours; the main archive does not depend on it.
        run: |
          sudo sed -i -e 's#mirror+file:/etc/apt/apt-mirrors.txt#http://archive.ubuntu.com/ubuntu/#' \
            -e 's#http://azure.archive.ubuntu.com/ubuntu/*#http://archive.ubuntu.com/ubuntu/#' \
            /etc/apt/sources.list /etc/apt/sources.list.d/*.sources 2>/dev/null || true
          echo 'Acquire::Retries "5";' | sudo tee /etc/apt/apt.conf.d/80-retries
          # The runner's resolver can fail on Ubuntu's hosts alone: public resolvers then.
          if ! getent hosts archive.ubuntu.com > /dev/null; then
            sudo mkdir -p /etc/systemd/resolved.conf.d
            printf '[Resolve]\nDNS=1.1.1.1 8.8.8.8\n' | sudo tee /etc/systemd/resolved.conf.d/fallback.conf
            sudo systemctl restart systemd-resolved
            getent hosts archive.ubuntu.com || true
          fi

      - name: Install mingw-w64
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build ccache mingw-w64

      - name: glslc
        # The assistant's GPU backend, for a release and on demand: its shaders, compiled by the host's glslc, take
        # minutes that no cache keeps. Ubuntu 26.04's (shaderc 2026.1) knows the extensions of ggml's faster shaders
        # but the two newest (see the Linux job's). The Vulkan headers and loader library for Windows are made by the
        # build.
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        run: sudo apt-get install -y --no-install-recommends glslc

      - name: Compiler cache
        # What the last runs compiled (the dependencies above all): only what changed is compiled again.
        uses: actions/cache/restore@v6
        with:
          path: .ccache
          key: ccache-windows-resolute-${{ github.run_id }}
          restore-keys: ccache-windows-resolute-

      - name: Configure
        env:
          VULKAN: ${{ (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') && 'ON' || 'OFF' }}
        run: >
          cmake -B build-win -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_TOOLCHAIN_FILE=cmake/mingw-w64.cmake -DMINGW_SUFFIX=-posix -DFCG_ASSISTANT_VULKAN=${VULKAN}

      - name: Build
        run: |
          ccache -z
          cmake --build build-win
          ccache -s

      - name: Compiler cache saved
        # Even when a later step fails or the run is cancelled: a cold build costs a private repository's
        # minutes again.
        if: always()
        uses: actions/cache/save@v6
        with:
          path: .ccache
          key: ccache-windows-resolute-${{ github.run_id }}

      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: |
            build-win/rookstudio.exe
            build-win/fastchess.exe
            build-win/fastchess-gui-tests.exe
            build-win/fcg-tournament-tests.exe
            build-win/fcg-study-tests.exe
            build-win/fcg-commentary-tests.exe
            build-win/fcg_random_mover.exe
            build-win/fcg_mock_assistant.exe
            build-win/*.dll

  windows-tests:
    name: Windows tests
    needs: windows-build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: windows
          path: bin

      - name: Tests
        # Side by side, each test case in a process of its own (tools/run_tests.py), two per processor of the runner.
        env:
          FCG_SOURCE_DIR: ${{ github.workspace }}
        run: >-
          python tools/run_tests.py -j ([int]$env:NUMBER_OF_PROCESSORS * 2) bin\fastchess-gui-tests.exe
          bin\fcg-tournament-tests.exe bin\fcg-study-tests.exe bin\fcg-commentary-tests.exe

  macos:
    name: macOS build and tests
    # A private repository counts macOS minutes ten times: the Mac builds the tags (a release needs it), and a run
    # started by hand when asked (gh workflow run gui.yml -R jromang/rookstudio --ref main -f macos=true); never a
    # push.
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.macos)
    # Apple silicon. The programs are universal (arm64 and x86_64), for macOS 13.3 and later.
    runs-on: macos-latest
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 500M
    steps:
      - uses: actions/checkout@v7

      - name: Install Ninja and ccache
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: |
          command -v ninja || brew install ninja
          command -v ccache || brew install ccache

      - name: Compiler cache
        # What the last runs compiled (the dependencies above all): only what changed is compiled again.
        uses: actions/cache/restore@v6
        with:
          path: .ccache
          key: ccache-macos-${{ github.run_id }}
          restore-keys: ccache-macos-

      - name: Configure
        # The assistant's libraries are not in the application bundle yet: built without it.
        run: >
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64"
          -DFCG_ASSISTANT=OFF

      - name: Build
        run: |
          ccache -z
          cmake --build build
          ccache -s

      - name: Compiler cache saved
        # Even when a later step fails or the run is cancelled: a cold build costs a private repository's
        # minutes again.
        if: always()
        uses: actions/cache/save@v6
        with:
          path: .ccache
          key: ccache-macos-${{ github.run_id }}

      - name: Universal binaries
        run: |
          for program in build/RookStudio.app/Contents/MacOS/RookStudio build/fastchess; do
            echo "${program}: $(lipo -archs "${program}"), $(vtool -show-build "${program}" | grep -m1 minos)"
            lipo "${program}" -verify_arch arm64 x86_64
          done

      - name: Tests
        # Side by side, each test case in a process of its own (tools/run_tests.py), two per processor.
        run: |
          python3 tools/run_tests.py -j $(( $(sysctl -n hw.ncpu) * 2 )) build/fastchess-gui-tests \
            build/fcg-tournament-tests build/fcg-study-tests build/fcg-commentary-tests

      - name: Package
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then version="${GITHUB_REF_NAME}"; else version="${GITHUB_SHA::7}"; fi
          macos="rookstudio-${version}-macos-universal"
          mkdir -p "dist/${macos}"
          # The application alone, as on Linux and Windows: it carries fastchess built in, and the guide (F1).
          cp -R build/RookStudio.app "dist/${macos}/"
          cp README.md LICENSE gui/assets/ATTRIBUTION.md "dist/${macos}/"
          cp -R gui/assets/licenses "dist/${macos}/"
          # Not signed by a developer (that needs an Apple Developer account): signed ad hoc, the whole bundle
          # sealed, which Apple silicon requires. Gatekeeper still asks, at the first start, to allow it.
          codesign --force --deep --sign - "dist/${macos}/RookStudio.app"
          codesign --verify --deep --strict "dist/${macos}/RookStudio.app"
          # ditto keeps the bundle as it is: permissions, signature, extended attributes.
          ditto -c -k --keepParent "dist/${macos}" "dist/${macos}.zip"
          ls -l dist

      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: dist/*.zip

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows-build, windows-tests, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Package
        run: |
          version="${GITHUB_REF_NAME}"
          # The guide is built into the program (F1): its Markdown files are not shipped.
          docs="README.md LICENSE gui/assets/ATTRIBUTION.md"

          linux="rookstudio-${version}-linux-x86_64"
          mkdir -p "dist/${linux}"
          cp artifacts/linux/rookstudio "dist/${linux}/"
          chmod +x "dist/${linux}/rookstudio"
          # The assistant's language model runtime (llama.cpp), beside the program that runs it.
          cp artifacts/linux/*.so "dist/${linux}/"
          cp ${docs} "dist/${linux}/"
          cp -r gui/assets/licenses "dist/${linux}/"
          tar -C dist -czf "dist/${linux}.tar.gz" "${linux}"

          windows="rookstudio-${version}-windows-x86_64"
          mkdir -p "dist/${windows}"
          cp artifacts/windows/rookstudio.exe "dist/${windows}/"
          cp artifacts/windows/*.dll "dist/${windows}/"
          cp ${docs} "dist/${windows}/"
          cp -r gui/assets/licenses "dist/${windows}/"
          (cd dist && zip -qr "${windows}.zip" "${windows}")

          # Packaged on the Mac, the application bundle signed there.
          cp "artifacts/macos/rookstudio-${version}-macos-universal.zip" dist/

          (cd dist && sha256sum *.tar.gz *.zip > SHA256SUMS.txt)
          ls -l dist

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="docs/releases/${GITHUB_REF_NAME}.md"
          if [ -f "$notes" ]; then args=(--notes-file "$notes"); else args=(--generate-notes); fi
          # Before 1.0, a preview (v0.7.0-preview.4) is published as a release, the latest: the previews' update
          # check reads GitHub's latest release only, and the repository's page shows it. From 1.0 on, a preview is a
          # pre-release, which the programs of a release do not offer.
          if [[ "${GITHUB_REF_NAME}" == *-* && "${GITHUB_REF_NAME}" != v0.* ]]; then args+=(--prerelease); fi
          gh release create "${GITHUB_REF_NAME}" --title "RookStudio ${GITHUB_REF_NAME}" "${args[@]}" \
            dist/*.tar.gz dist/*.zip dist/SHA256SUMS.txt
